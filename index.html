<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مقلب</title>
<style>
  html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:'Tahoma','Arial',sans-serif;}
  #stage{position:relative;width:100%;height:100vh;display:flex;align-items:center;justify-content:center;}
  .screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;box-sizing:border-box;}
  .screen.active{display:flex;}
  #s1{background:#000;color:#0f0;}
  #s1 h1{font-size:8vw;color:#f00;text-shadow:0 0 15px #f00;animation:glitch 0.15s infinite;}
  #s1 p{font-size:4vw;color:#0f0;}
  @keyframes glitch{
    0%{transform:translate(0,0);}
    20%{transform:translate(-3px,2px);}
    40%{transform:translate(3px,-2px);}
    60%{transform:translate(-2px,-2px);}
    80%{transform:translate(2px,2px);}
    100%{transform:translate(0,0);}
  }
  #s2{background:#000;}
  #s2 img{max-width:100%;max-height:100vh;object-fit:contain;animation:pop 0.4s ease-out;}
  @keyframes pop{from{transform:scale(0.3);opacity:0;}to{transform:scale(1);opacity:1;}}
  #s3{background:#111;color:#fff;}
  #s3 h1{color:#f00;font-size:6vw;}
  #s3 p{font-size:4.5vw;line-height:1.6;}
  #s4{background:#0a0a0a;color:#eee;}
  #s4 h2{color:#0f0;}
  #s4 button{margin-top:20px;padding:12px 24px;font-size:4vw;border:none;border-radius:8px;background:#0f0;color:#000;font-weight:bold;cursor:pointer;}
  .blink{animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:0;}}
</style>

<script>
  const seq = ["s1","s2","s3","s4"];
  const timings = [2200, 1600, 2800]; // ms before moving to next screen (last screen stays)
  let i = 0;
  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }
  function next(){
    if(i < timings.length){
      setTimeout(()=>{
        i++;
        show(seq[i]);
        next();
      }, timings[i]);
    }
  }
  next();
</script>
